name: update-fee-data

on:
  schedule:
    - cron: "45 10 * * 1-5" # Asia/Shanghai 18:45
    - cron: "5 0 * * 1-5"   # 08:05, first post-holiday morning only
  workflow_dispatch:
    inputs:
      republish_current:
        description: Verify current archive and data-branch publication without exchange access
        type: boolean
        default: false

concurrency:
  group: future-meta-production-official-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      should_update: ${{ steps.slot.outputs.should_update }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test offline session admission
        run: python -m unittest discover -s tests -p 'test_official_schedule.py'
      - name: Decide without contacting exchanges
        id: slot
        run: python scripts/update_schedule.py --github-output "$GITHUB_OUTPUT"

  update:
    needs: admission
    if: needs.admission.outputs.should_update == 'true' || (github.event_name == 'workflow_dispatch' && inputs.republish_current)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install collector test dependencies
        run: python -m pip install requests playwright
      - name: Install official browser
        if: inputs.republish_current != true
        run: python -m playwright install --with-deps chrome
      - name: Test
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace
          cargo test -p future-meta --features download
          python -m unittest discover -s tests
      - name: Check official metadata and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLISH_CURRENT: ${{ inputs.republish_current && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p data
          args=()
          runner=(xvfb-run -a python -u)
          if [[ "$REPUBLISH_CURRENT" == 'true' ]]; then
            args+=(--republish-current)
            runner=(python -u)
          fi
          "${runner[@]}" scripts/update_official.py \
            --repo "$GITHUB_REPOSITORY" --work-dir data/official-update \
            "${args[@]}" 2>&1 | tee data/update.log
      - name: Retain summary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-update-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            data/update.log
            data/official-update/publication/update-report.json
