name: update-fee-data

on:
  schedule:
    # 18:45 Asia/Shanghai.
    - cron: "45 10 * * *"
  workflow_dispatch:

env:
  DB_PATH: data/future-meta.sqlite
  SEED_URL: https://future-meta.pages.dev/ops/future-meta.sqlite.gz
  SEED_ARCHIVE: public/ops/future-meta.sqlite.gz
  REVIEWED_SEED_ARCHIVE: assets/future-meta-v18-reviewed.sqlite.gz
  REVIEWED_BASELINE_SOURCE_SHA256: 5690905cd18dcd9d5e32c9ffca9f8eb998978432dd67f0129dc5f9c7e0c7c242
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo test --workspace
          cargo test -p future-meta --features download

      - name: Restore Cloudflare daemon seed
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$DB_PATH")"
          curl --fail --location --show-error "$SEED_URL" --output /tmp/future-meta.sqlite.gz
          gzip -dc /tmp/future-meta.sqlite.gz > "$DB_PATH"
          if ! sqlite3 "$DB_PATH" \
            "select name from sqlite_master where type = 'table' and name = 'baseline_state';" \
            | grep -qx baseline_state; then
            echo "Bootstrapping reviewed V18 daemon seed"
            gzip -dc "$REVIEWED_SEED_ARCHIVE" > "$DB_PATH"
          fi
          if [ "$(sqlite3 "$DB_PATH" \
            "select source_sha256 from baseline_state where baseline_version = 'v11' limit 1;")" \
            != "$REVIEWED_BASELINE_SOURCE_SHA256" ]; then
            echo "Migrating daemon seed to reviewed V18 baseline"
            gzip -dc "$REVIEWED_SEED_ARCHIVE" > "$DB_PATH"
          fi
          cargo run -p future-meta-daemon -- inspect --db "$DB_PATH"

      - name: Verify daemon seed coverage
        run: |
          set -euo pipefail
          if ! cargo run -q -p future-meta-daemon -- audit-coverage \
            --db "$DB_PATH" \
            --from 2020-01-01 \
            --through "$(TZ=Asia/Shanghai date +%F)" \
            --out /tmp/seed-coverage.json \
            --strict; then
            echo "Downloaded daemon seed failed strict coverage; restoring reviewed seed" >&2
            gzip -dc "$REVIEWED_SEED_ARCHIVE" > "$DB_PATH"
            cargo run -q -p future-meta-daemon -- audit-coverage \
              --db "$DB_PATH" \
              --from 2020-01-01 \
              --through "$(TZ=Asia/Shanghai date +%F)" \
              --out /tmp/reviewed-seed-coverage.json \
              --strict
          fi

      - name: Refresh data
        id: refresh
        timeout-minutes: 20
        run: |
          set -euo pipefail
          if [ "$(TZ=Asia/Shanghai date +%u)" = "5" ]; then
            cargo run -p future-meta-daemon -- scan-announcements --db "$DB_PATH" --reconcile-htfc
          else
            cargo run -p future-meta-daemon -- scan-announcements --db "$DB_PATH"
          fi
          set +e
          cargo run -p future-meta-daemon -- update-latest --db "$DB_PATH" --require-seed 2> /tmp/update-latest.stderr
          refresh_status=$?
          set -e
          if [ "$refresh_status" -ne 0 ]; then
            cat /tmp/update-latest.stderr >&2
            if ! grep -Eq "latest fee candidates before history write|require staged verified official evidence before history write|new concrete contracts require staged official fee evidence" /tmp/update-latest.stderr; then
              echo "latest refresh failed unexpectedly (exit=$refresh_status)" >&2
              exit "$refresh_status"
            fi
            echo "latest fee changes deferred: waiting for official evidence"
          fi
          echo "publish=false" >> "$GITHUB_OUTPUT"

      - name: Validate Jin10 secondary source
        if: steps.refresh.outputs.publish == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          SNAPSHOT_DATE="$(TZ=Asia/Shanghai date +%F)"
          cargo run -p future-meta-daemon -- validate-jin10 \
            --db "$DB_PATH" \
            --from "$SNAPSHOT_DATE" \
            --to "$SNAPSHOT_DATE" \
            --out /tmp/jin10-validation.json
          cat /tmp/jin10-validation.json

      - name: Export Pages artifact
        if: steps.refresh.outputs.publish == 'true'
        run: cargo run -p future-meta-daemon -- export --db "$DB_PATH" --out public

      - name: Publish updated daemon seed
        if: steps.refresh.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$SEED_ARCHIVE")"
          gzip -c "$DB_PATH" > "$SEED_ARCHIVE"

      - name: Compute artifact hash
        if: steps.refresh.outputs.publish == 'true'
        id: artifact
        run: echo "sha=$(sha256sum public/latest.fmeta.zst | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        if: steps.refresh.outputs.publish == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=future-meta --branch=main --commit-dirty=true
