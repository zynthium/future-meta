name: update-fee-data

on:
  schedule:
    - cron: "35,50 10 * * 1-5" # Asia/Shanghai 18:35, 18:50
    - cron: "5,20,35 11 * * 1-5" # 19:05, 19:20, 19:35
    - cron: "2,7,12 0 * * 1-5" # 08:02, 08:07, 08:12; post-holiday only
    - cron: "37 0 * * 1-5" # 08:37, read-only checkpoint watch
    - cron: "17 12 * * 1-5" # 20:17, read-only checkpoint watch
  workflow_dispatch:
    inputs:
      republish_current:
        description: Verify current archive and data-branch publication without exchange access
        type: boolean
        default: false

concurrency:
  group: future-meta-production-official-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should_update: ${{ steps.slot.outputs.should_update }}
      target_through: ${{ steps.slot.outputs.target_through }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check slot, checkpoint and full CI without contacting exchanges
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLISH_CURRENT: ${{ inputs.republish_current && 'true' || 'false' }}
          HEALTH_ONLY: ${{ github.event.schedule == '37 0 * * 1-5' || github.event.schedule == '17 12 * * 1-5' }}
        run: |
          args=()
          if [[ "$REPUBLISH_CURRENT" == 'true' ]]; then
            args+=(--republish-current)
          elif [[ "$HEALTH_ONLY" == 'true' ]]; then
            args+=(--health-only)
          fi
          python scripts/update_admission.py --repo "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT" "${args[@]}"

  update:
    needs: admission
    if: needs.admission.outputs.should_update == 'true' || (github.event_name == 'workflow_dispatch' && inputs.republish_current)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install collector dependencies
        run: python -m pip install requests playwright
      - name: Install official browser
        if: inputs.republish_current != true
        run: python -m playwright install --with-deps chrome
      - name: Check official metadata and publish atomically
        env:
          GH_TOKEN: ${{ github.token }}
          REPUBLISH_CURRENT: ${{ inputs.republish_current && 'true' || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p data
          args=()
          runner=(xvfb-run -a python -u)
          if [[ "$REPUBLISH_CURRENT" == 'true' ]]; then
            args+=(--republish-current)
            runner=(python -u)
          fi
          "${runner[@]}" scripts/update_official.py \
            --repo "$GITHUB_REPOSITORY" --work-dir data/official-update \
            "${args[@]}" 2>&1 | tee data/update.log
      - name: Retain summary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-update-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: warn
          path: |
            data/update.log
            data/official-update/publication/update-report.json

  verify:
    needs: [admission, update]
    if: always() && needs.admission.result == 'success' && needs.update.result != 'skipped' && inputs.republish_current != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Require all six exchanges to reach the admitted target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_THROUGH: ${{ needs.admission.outputs.target_through }}
        run: python scripts/update_admission.py --repo "$GITHUB_REPOSITORY" --verify-through "$TARGET_THROUGH"
