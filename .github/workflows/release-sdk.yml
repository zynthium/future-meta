name: release-sdk

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: future-meta-sdk-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate tag, package version and main ancestry
        id: release
        run: python scripts/check_sdk_release.py "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install requests playwright curl_cffi PyYAML
      - name: Check documentation and SDK
        run: |
          python scripts/check_docs.py
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo test -p future-meta --features download --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          python -m unittest discover -s tests

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Publish SDK Release and read it back
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.verify.outputs.previous_tag }}
        run: |
          set -euo pipefail
          args=(--verify-tag --latest --title "$GITHUB_REF_NAME")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
          else
            args+=(--notes "Initial SDK release.")
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq 'if .draft or .prerelease then error("SDK Release is not stable") else {tag_name, html_url} end'
