name: release-sdk

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: future-meta-sdk-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate tag, package version and main ancestry
        id: release
        run: python scripts/check_sdk_release.py "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install requests playwright curl_cffi PyYAML
      - name: Check documentation and SDK
        run: |
          python scripts/check_docs.py
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo test -p future-meta --features download --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo package -p future-meta --locked --offline
          cargo build -p future-meta-py --locked
          python -m unittest discover -s tests

  wheels:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            sdist: true
          - os: ubuntu-latest
            target: aarch64
            sdist: false
          - os: macos-15-intel
            target: x86_64
            sdist: false
          - os: macos-latest
            target: aarch64
            sdist: false
          - os: windows-latest
            target: x86_64
            sdist: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build Python wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist --locked
          sccache: "true"
      - name: Build Python sdist
        if: matrix.sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheels-*
          path: dist
          merge-multiple: true
      - name: Publish Rust crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || vars.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "Missing CARGO_REGISTRY_TOKEN in GitHub Secrets/Variables" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -s -o /dev/null -w "%{http_code}" -A "future-meta-release-ci" \
            "https://crates.io/api/v1/crates/future-meta/$version")
          if [[ "$status" == "200" ]]; then
            echo "future-meta $version is already published on crates.io"
          else
            cargo publish -p future-meta --locked
          fi
      - name: Publish Python wheels and sdist to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN || vars.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TWINE_PASSWORD" ]]; then
            echo "Missing PYPI_API_TOKEN in GitHub Secrets/Variables" >&2
            exit 1
          fi
          python -m pip install twine
          python -m twine upload --skip-existing --non-interactive dist/*
      - name: Publish SDK Release and read it back
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.verify.outputs.previous_tag }}
        run: |
          set -euo pipefail
          args=(--verify-tag --latest --title "$GITHUB_REF_NAME")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--generate-notes --notes-start-tag "$PREVIOUS_TAG")
          else
            args+=(--notes "Initial SDK release.")
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${args[@]}"
          else
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq 'if .draft or .prerelease then error("SDK Release is not stable") else {tag_name, html_url, assets: [.assets[].name]} end'
