[package]
name = "future-meta-py"
version = "0.8.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "future_meta_py"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
future-meta = { path = "../future-meta", features = ["download"] }
pyo3.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true

[lints]
workspace = true
